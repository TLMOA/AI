[Service]
# 覆盖 unit 里的 ExecStart（绑定地址由 BACKEND_BIND 决定）
ExecStart=
ExecStart=__CODE_DIR__/v1-backend/.venv/bin/python -m uvicorn app.main:app --host __BACKEND_BIND__ --port __BACKEND_PORT__

# 认证源：MySQL（独立于 backend mode 切换）
Environment=IOT_AUTH_DB=nifi
Environment=NIFI_DB_TYPE=mysql
Environment=NIFI_DB_HOST=127.0.0.1
Environment=NIFI_DB_PORT=3306
Environment=NIFI_DB_USER=__DB_USER__
Environment=NIFI_DB_PASSWORD=__DB_PASS__
Environment=NIFI_DB_NAME=__DB_NAME__
Environment=PYTHONUNBUFFERED=1

# xattr 元数据加密密钥（AES-256-GCM，base64 32 字节）
Environment=META_XATTR_KEY=__META_KEY__

# JWT 签名密钥 —— 每台机器必须不同且随机
Environment=IOT_SECRET_KEY=__SECRET_KEY__

Environment=IOT_ACCESS_EXPIRE_SECONDS=__SESSION_TTL__

# 启用真实 NiFi 容器执行
Environment=NIFI_REAL_EXECUTION=true

# 是否允许自助注册（方案一=false，只能管理员开户）
Environment=IOT_ALLOW_SELF_REGISTER=__ALLOW_SELF_REGISTER__

# 兜底：万一未打「禁止默认 admin」补丁，默认 admin 的密码也不会是弱口令 123456
Environment=IOT_ADMIN_PASSWORD=__SITE_PASS__

# 用户数据根目录（公有化用户落在 <IN_DATA_BASE_DIR>/<username>）
Environment=IN_DATA_BASE_DIR=__APP_HOME__
