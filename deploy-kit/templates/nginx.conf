server {
    listen 80;
    server_name __DOMAIN__;

    # 上传大小限制（大 CSV 需要）
    client_max_body_size 100m;

    # 前端静态资源 + /api/v1 代理由 serve.py 处理
    location / {
        proxy_pass http://127.0.0.1:__FRONTEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # 也可直连后端（可选，serve.py 已代理 /api/v1，此段默认保留便于排查）
    location /api/v1/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # NiFi 管理界面（建议仅限内网访问，生产可用 allow/deny 限制来源）
    #
    # ⚠️ 必须用 localhost 而不是 127.0.0.1：
    #    NiFi 的 TLS 会校验 SNI，用 IP 直连会返回 400 Invalid SNI。
    #    proxy_ssl_server_name on 让 nginx 把 SNI 发成 localhost，才通得过。
    location /nifi/ {
        proxy_pass https://localhost:__NIFI_PORT__/nifi/;
        proxy_ssl_server_name on;
        proxy_set_header Host localhost:__NIFI_PORT__;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }
}
