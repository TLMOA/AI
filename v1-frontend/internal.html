<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>内部管理页</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .internal-grid {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 12px;
    }
    .internal-grid > div {
      min-width: 0;
    }
    .tree-box {
      max-height: 420px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }
    .file-table-wrap {
      max-height: 260px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .file-table-wrap table,
    .preview-table-wrap table {
      width: 100%;
      table-layout: fixed;
    }
    .file-table-wrap th,
    .file-table-wrap td,
    .preview-table-wrap th,
    .preview-table-wrap td {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .preview-table-wrap {
      max-height: 320px;
      overflow-x: auto;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      margin-top: 8px;
    }
    .preview-table-wrap table {
      width: max-content;
      min-width: 100%;
      table-layout: auto;
    }
    .preview-table-wrap th,
    .preview-table-wrap td {
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      max-width: none;
    }
    .preview-table-wrap table thead th {
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2;
    }
    .muted {
      color: var(--muted);
      font-size: 12px;
    }
    .backend-toggle-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
    }
    .backend-toggle-btn {
      border-radius: 999px;
      border: 0;
      padding: 8px 14px;
      background: transparent;
      color: var(--muted);
      font-weight: 600;
    }
    .backend-toggle-btn.active {
      background: var(--primary, #2563eb);
      color: #fff;
    }
    #previewRaw {
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: anywhere;
      max-width: 100%;
    }
    @media (max-width: 980px) {
      .internal-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="row" style="justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
        <div>
          <h1>内部管理页</h1>
          <p>工厂归档中心（in_data）</p>
          <p><a href="./index.html" rel="noopener">返回主控制台</a></p>
        </div>
        <div style="display:flex;align-items:center;gap:12px;">
          <span class="small" id="currentUserLabel" style="color:#475569;"></span>
          <button id="logoutBtn" type="button" class="secondary" style="background:#ef4444;color:#fff;border-color:#ef4444;">退出登录</button>
        </div>
      </div>
    </header>

    <section class="card">
      <div class="row">
        <label>切换用户</label>
        <select id="userSelect"></select>
        <button id="pullBtn" class="secondary" style="display:none;">拉取数据</button>
        <button id="refreshBtn">刷新</button>
        <span id="statusMsg" class="muted"></span>
      </div>
      <div class="row" style="margin-top:4px;">
        <span id="userInfo" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <div class="row">
        <span class="muted silent-label">Silent Export</span>
        <input type="checkbox" id="silentExportToggle" />
        <button id="silentExportTrigger" class="secondary">立即触发一次</button>
        <button id="silentExportListBtn" class="secondary">查看已注册表</button>
        <span class="muted" style="margin-left:8px;">（静默导出：当定时任务未按预期运行时自动补做导出；先在「数据库导出」中成功导出过表才会被注册）</span>
        <span id="silentExportStatus" class="muted" style="margin-left:12px;"></span>
      </div>
      <div id="silentExportManifestPanel" class="muted" style="margin-top:6px; display:none;"></div>
    </section>

    <section class="card internal-grid">
      <div>
        <h3>目录树</h3>
        <div id="treeBox" class="small tree-box"></div>
      </div>
      <div>
        <h3>文件列表</h3>
        <p id="currentPath" class="muted"></p>
        <div id="fileTableWrapper">
          <table>
            <thead>
              <tr>
                <th>fileId</th><th>文件名</th><th>格式</th><th>大小</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="fileTable"></tbody>
          </table>
        </div>
        <div class="row" style="margin-top:8px; gap:8px; align-items:center;">
          <button id="prevPage">上一页</button>
          <button id="nextPage">下一页</button>
          <label>每页</label>
          <select id="pageSizeSelect">
            <option value="20">20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
          <span id="filePageInfo" class="muted"></span>
        </div>

        <h3 style="margin-top:12px;">文件预览</h3>
        <div class="row">
          <label>offset</label>
          <input id="previewOffset" type="number" min="0" value="0" />
          <label>limit</label>
          <input id="previewLimit" type="number" min="1" value="100" />
          <button id="reloadPreviewBtn" class="secondary">刷新预览</button>
          <button id="loadMorePreviewBtn" class="secondary" style="display:none;">下一批</button>
          <span id="previewProgress" class="muted"></span>
        </div>
        <div class="preview-table-wrap">
          <table class="preview-table">
            <thead id="previewHead"></thead>
            <tbody id="previewBody"></tbody>
          </table>
        </div>
        <pre id="previewRaw" style="display:none;">请选择文件并点击预览</pre>
        <div class="row" style="margin-top:8px; gap:8px; align-items:center;">
          <label>分隔符</label>
          <select id="delimiterSelect">
            <option value="," selected>逗号 (,)</option>
            <option value="\t">制表符 (\t)</option>
            <option value=";">分号 (;)</option>
          </select>
          <label>编码</label>
          <select id="encodingSelect">
            <option value="utf-8" selected>UTF-8</option>
            <option value="gbk">GBK</option>
          </select>
          <button id="downloadFullBtn" class="secondary">下载完整文件</button>
        </div>
      </div>
    </section>

    <section class="card" id="xattrMetaSection" style="margin-top:16px;">
      <h3>文件元数据（xattr）</h3>
      <p class="small muted">展示文件扩展属性中存储的配置信息，仅管理员可查看。</p>
      <div class="row">
        <label>当前选中文件</label>
        <input id="xattrSelectedFileId" type="text" placeholder="在文件列表点击“预览”选择文件" readonly style="flex:1;" />
        <button id="xattrLoadBtn" type="button" class="secondary">加载 xattr</button>
      </div>
      <div id="xattrStatus" class="small muted" style="margin-top:8px;"></div>
      <div id="xattrMetaContent" style="margin-top:12px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; padding:12px; max-height:360px; overflow:auto;">
        <div class="muted">请选择文件后点击“加载 xattr”。</div>
      </div>
    </section>

    <section class="card" id="userManagementSection" style="margin-top:16px;">
      <h3>用户管理</h3>
      <div class="row" style="margin-bottom:8px; gap:8px;">
        <button id="userMgmtRefreshBtn" class="secondary">刷新列表</button>
        <span id="userMgmtStatus" class="muted"></span>
      </div>
      <div class="file-table-wrap">
        <table>
          <thead>
            <tr>
              <th>用户名</th><th>管理员</th><th>部署模式</th><th>Ceph 路径</th><th>创建时间</th><th>操作</th>
            </tr>
          </thead>
          <tbody id="userMgmtBody"></tbody>
        </table>
      </div>
      <!-- 编辑部署模式弹窗 -->
      <div id="editDeploymentModal" style="display:none; position:fixed; top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:999; align-items:center;justify-content:center;">
        <div style="background:#fff; padding:24px; border-radius:8px; width:420px; max-width:92%;">
          <h3>修改部署模式</h3>
          <div class="form-group">
            <label>用户名</label>
            <input id="editDeployUsername" type="text" readonly style="background:#f5f5f5;">
          </div>
          <div class="form-group">
            <label>部署模式</label>
            <div style="display:flex; gap:14px;">
              <label style="font-weight:400; cursor:pointer;">
                <input type="radio" name="editDeployMode" value="public" checked> 公有化
              </label>
              <label style="font-weight:400; cursor:pointer;">
                <input type="radio" name="editDeployMode" value="private"> 私有化
              </label>
            </div>
          </div>
          <div class="form-group" id="editCephGroup">
            <label>Ceph 路径</label>
            <input id="editCephEndpoint" type="text" placeholder="/home/yhz/ceph/factory_x">
          </div>
          <div class="row" style="gap:8px; margin-top:12px;">
            <button id="editDeploySave" class="primary">保存</button>
            <button id="editDeployCancel" class="secondary">取消</button>
          </div>
          <div id="editDeployError" class="error" style="display:none; margin-top:8px;"></div>
        </div>
      </div>
    </section>

  </div>

  <script src="./config.js?v=20260725_1"></script>
  <script src="./internal.js?v=20260725_1"></script>
</body>
</html>
