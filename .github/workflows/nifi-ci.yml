name: NiFi CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  IMAGE_NAME: iot-nifi-python
  REGISTRY_URL: ${{ secrets.REGISTRY_URL }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install test requirements
        run: |
          python -m pip install --upgrade pip
          if [ -f v2-nifi/examples/requirements.txt ]; then pip install -r v2-nifi/examples/requirements.txt; fi

      - name: Run pytest
        run: |
          pytest -q v2-nifi/tests || true

      - name: Log in to container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: docker/nifi/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:latest

      - name: Upload image info
        if: always()
        run: |
          echo "Pushed images: ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ github.sha }} and latest"
name: nifi-ci

on:
  push:
    paths:
      - 'v2-nifi/**'
      - '.github/workflows/nifi-ci.yml'
  pull_request:
    paths:
      - 'v2-nifi/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install lint deps
        run: pip install flake8 yamllint
      - name: Lint Python
        run: |
          flake8 v2-nifi || true
      - name: Lint YAML
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 200}}}" v2-nifi || true

  build-manifests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Validate k8s manifests
        run: |
          echo "k8s manifest validation (placeholder)"
      - name: Package Flow bundle (placeholder)
        run: |
          echo "flow bundle step - integrate with NiFi Registry in later iteration"
