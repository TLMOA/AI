[Service]
# Use verified working virtualenv
ExecStart=
ExecStart=/home/yhz/iot/v1-backend/.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8081

# Auth source: MySQL nifi database (independent from backend mode switch)
Environment=IOT_AUTH_DB=nifi
Environment=NIFI_DB_TYPE=mysql
Environment=NIFI_DB_HOST=127.0.0.1
Environment=NIFI_DB_PORT=3306
Environment=NIFI_DB_USER=root
Environment=NIFI_DB_PASSWORD=root
Environment=NIFI_DB_NAME=nifi
Environment=PYTHONUNBUFFERED=1
